name: Deploy GreenPoly

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build Next.js app
      run: |
        npm install
        npx prisma generate
        npm run build
      env:
        NEXT_PUBLIC_SITE_URL: https://green.richardq.tech
        DATABASE_URL: file:./build.db

    - name: Push code to server
      # 服务器连不上 GitHub（GFW），所以不再在服务器上 git pull ——
      # 由 CI  runner 把代码打包直接推过去。tar 流不含 .git/env/db，
      # 每个提交上传到独立 release 目录，服务器上的 .env、prod.db 不受影响。
      env:
        RELEASE_DIR: /var/www/greenpoly-releases/${{ github.sha }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "mkdir -p '$RELEASE_DIR'"
        tar czf - \
          --exclude=.git --exclude=node_modules \
          --exclude=dev.db --exclude=prod.db --exclude=.env --exclude=".env.*" \
          . | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "tar xzf - -C '$RELEASE_DIR'"

    - name: Build and restart on server
      uses: appleboy/ssh-action@v1.0.3
      env:
        GREENPOLY_INTERNAL_STATS_TOKEN: ${{ secrets.GREENPOLY_INTERNAL_STATS_TOKEN }}
        GREENPOLY_ADMIN_PASSWORD: ${{ secrets.GREENPOLY_ADMIN_PASSWORD }}
        GREENPOLY_AUTH_SECRET: ${{ secrets.GREENPOLY_AUTH_SECRET }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        envs: GREENPOLY_INTERNAL_STATS_TOKEN,GREENPOLY_ADMIN_PASSWORD,GREENPOLY_AUTH_SECRET
        # 服务器端构建(npm install+prisma+next build+canary)常超 10 分钟默认值,
        # 提到 30 分钟,避免被 ssh-action 中途杀掉留下不确定状态
        command_timeout: 30m
        script: |
          set -e
          RELEASE_DIR="/var/www/greenpoly-releases/${{ github.sha }}"
          SHARED_DIR="/var/www/greenpoly"
          PREVIOUS_DIR="$(readlink -f /var/www/greenpoly-current 2>/dev/null || true)"
          if [ -z "$PREVIOUS_DIR" ]; then PREVIOUS_DIR="$SHARED_DIR"; fi

          # 统计令牌和 JWT 签名密钥仅从 GitHub Secret 注入，并原子更新共享生产 .env。
          # 管理员密码只在本次进程环境中使用，绝不写进 .env 或日志。
          test -f "$SHARED_DIR/.env"
          ENV_FILE="$SHARED_DIR/.env" node <<'NODE'
          const fs = require("node:fs");
          const file = process.env.ENV_FILE;
          const token = process.env.GREENPOLY_INTERNAL_STATS_TOKEN;
          const authSecret = process.env.GREENPOLY_AUTH_SECRET;
          const adminPassword = process.env.GREENPOLY_ADMIN_PASSWORD;
          const invalid = (value, minimum) => !value || Buffer.byteLength(value) < minimum || /[\r\n]/.test(value);
          if (!file || invalid(token, 32) || invalid(authSecret, 32) || invalid(adminPassword, 20)) {
            throw new Error("missing or weak GreenPoly production secret");
          }
          const current = fs.readFileSync(file, "utf8");
          // The canary needs the metrics token. Keep the authentication key
          // unchanged until it has passed, so a failed release cannot leave
          // the running service with partially rotated authentication state.
          const entries = [["GREENPOLY_INTERNAL_STATS_TOKEN", token]];
          let next = current;
          for (const [key, value] of entries) {
            const pattern = new RegExp(`^${key}=.*$`, "m");
            const line = `${key}=${value}`;
            next = pattern.test(next)
              ? next.replace(pattern, line)
              : `${next.replace(/\n?$/, "\n")}${line}\n`;
          }
          const temporary = `${file}.tmp-${process.pid}`;
          fs.writeFileSync(temporary, next, { mode: 0o600 });
          fs.renameSync(temporary, file);
          NODE

          cd "$RELEASE_DIR"
          ln -sfn "$SHARED_DIR/.env" .env
          export DATABASE_URL="file:$SHARED_DIR/prod.db"

          # CI 已构建 .next,服务器只需安装生产依赖并生成 Prisma 客户端。
          # 若 CI 构建产物缺失或不兼容,仍完整重建作为降级路径。
          if [ ! -d .next ] || [ ! -f .next/BUILD_ID ]; then
            echo "⚠️  CI 构建产物缺失，服务器端完整重建"
            npm install --registry=https://registry.npmmirror.com --no-audit --no-fund || \
              npm install --registry=https://registry.npmjs.org --no-audit --no-fund
            npx prisma generate
            npm run build
          else
            echo "✓ 复用 CI 构建产物"
            npm install --omit=dev --registry=https://registry.npmmirror.com --no-audit --no-fund || \
              npm install --omit=dev --registry=https://registry.npmjs.org --no-audit --no-fund
            npx prisma generate
          fi

          # 迁移共享数据库；迁移必须保持向后兼容，旧 release 才能回滚。
          npx prisma migrate deploy

          # 先在 3003 启动 canary。除了首页，还验证后台保护和浏览器同源登录。
          pm2 delete greenpoly-canary > /dev/null 2>&1 || true
          PORT=3003 pm2 start npm --name greenpoly-canary --cwd "$RELEASE_DIR" -- start

          CANARY_OK=0
          for attempt in $(seq 1 20); do
            HOME_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/ || true)"
            SALES_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/admin/sales || true)"
            LOGIN_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:3003/api/admin/login \
              -H 'content-type: application/json' \
              -H 'origin: https://green.richardq.tech' \
              --data '{"email":"invalid@example.test","password":"invalid-password"}' || true)"
            if [ "$HOME_STATUS" = "200" ] && [ "$SALES_STATUS" = "307" ] && [ "$LOGIN_STATUS" = "401" ]; then
              CANARY_OK=1
              break
            fi
            sleep 1
          done

          if [ "$CANARY_OK" = "1" ]; then
            curl -fsS -H "Authorization: Bearer $GREENPOLY_INTERNAL_STATS_TOKEN" \
              "http://127.0.0.1:3003/api/internal/marketing-stats?days=1" > /dev/null || CANARY_OK=0
          fi
          pm2 delete greenpoly-canary > /dev/null 2>&1 || true
          if [ "$CANARY_OK" != "1" ]; then
            echo "Canary health check failed"
            exit 1
          fi

          # Only commit the authentication rotation after the canary is healthy.
          ENV_FILE="$SHARED_DIR/.env" node <<'NODE'
          const fs = require("node:fs");
          const file = process.env.ENV_FILE;
          const authSecret = process.env.GREENPOLY_AUTH_SECRET;
          if (!file || !authSecret || Buffer.byteLength(authSecret) < 32 || /[\r\n]/.test(authSecret)) {
            throw new Error("missing or weak GreenPoly authentication secret");
          }
          const current = fs.readFileSync(file, "utf8");
          const line = `AUTH_SECRET=${authSecret}`;
          const next = /^AUTH_SECRET=.*$/m.test(current)
            ? current.replace(/^AUTH_SECRET=.*$/m, line)
            : `${current.replace(/\n?$/, "\n")}${line}\n`;
          const temporary = `${file}.tmp-${process.pid}`;
          fs.writeFileSync(temporary, next, { mode: 0o600 });
          fs.renameSync(temporary, file);
          NODE
          npx tsx scripts/rotate-admin-password.ts

          # Canary 通过后再切换正式端口；失败则恢复上一个 release。
          pm2 delete greenpoly > /dev/null 2>&1 || true
          PORT=3002 pm2 start npm --name greenpoly --cwd "$RELEASE_DIR" -- start

          PRODUCTION_OK=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3002/ > /dev/null; then
              PRODUCTION_OK=1
              break
            fi
            sleep 1
          done

          if [ "$PRODUCTION_OK" != "1" ]; then
            echo "Production health check failed; rolling back to $PREVIOUS_DIR"
            pm2 delete greenpoly > /dev/null 2>&1 || true
            PORT=3002 pm2 start npm --name greenpoly --cwd "$PREVIOUS_DIR" -- start
            pm2 save
            exit 1
          fi

          ln -sfn "$RELEASE_DIR" /var/www/greenpoly-current
          pm2 save
          echo "✅ GreenPoly deployed successfully: $RELEASE_DIR"

    - name: Bark 通知
      if: always()
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: |
        if [ -z "$BARK_KEY" ]; then echo "BARK_KEY 未配置，跳过通知"; exit 0; fi
        if [ "${{ job.status }}" = "success" ]; then
          RESULT="成功"; LEVEL="active"; SOUND="minuet"; GROUP="CI/CD · 成功"
        else
          RESULT="失败"; LEVEL="timeSensitive"; SOUND="alarm"; GROUP="CI/CD · 失败"
        fi
        jq -n \
          --arg key "$BARK_KEY" \
          --arg title "部署$RESULT · GreenPoly" \
          --arg body "分支：${{ github.ref_name }} · 提交：${GITHUB_SHA:0:7} · 点击查看运行详情" \
          --arg group "$GROUP" \
          --arg level "$LEVEL" \
          --arg sound "$SOUND" \
          --arg id "cicd-${{ github.repository_id }}-deploy" \
          --arg icon "https://stats.richardq.tech/icon-greenpoly.png" \
          --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          '{device_key:$key,title:$title,subtitle:"GitHub Actions",body:$body,group:$group,level:$level,sound:$sound,id:$id,icon:$icon,url:$url,isArchive:"1"}' \
          | curl -fsS -m 10 -X POST "https://api.day.app/push" \
              -H "Content-Type: application/json; charset=utf-8" -d @- \
          || echo "Bark 通知发送失败（不影响构建）"

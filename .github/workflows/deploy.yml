name: Deploy GreenPoly

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build Next.js app
      run: |
        npm install
        npx prisma generate
        npm run build
      env:
        NEXT_PUBLIC_SITE_URL: https://richardq.tech
        DATABASE_URL: file:./build.db

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # 创建项目目录
          mkdir -p /var/www/greenpoly
          cd /var/www/greenpoly

          # 拉取最新代码
          git pull origin main 2>/dev/null || git clone https://github.com/OrangeK1NG-714/vb-greenpoly.git .

          # 完整安装依赖(Next 构建需要 devDependencies)
          npm install

          # 先生成 Prisma 客户端,再构建(顺序不能反)
          export DATABASE_URL="file:/var/www/greenpoly/prod.db"
          npx prisma generate
          npm run build

          # 数据库迁移
          npx prisma migrate deploy || echo "No migrations to apply"

          # 用 PM2 启动或重启服务
          pm2 describe greenpoly > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            pm2 restart greenpoly
          else
            pm2 start npm --name greenpoly -- start
          fi

          pm2 save
          echo "✅ GreenPoly deployed successfully"

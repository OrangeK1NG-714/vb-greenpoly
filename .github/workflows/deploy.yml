name: Deploy GreenPoly

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build Next.js app
      run: |
        npm install
        npx prisma generate
        npm run build
      env:
        NEXT_PUBLIC_SITE_URL: https://green.richardq.tech
        DATABASE_URL: file:./build.db

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # 创建项目目录
          mkdir -p /var/www/greenpoly
          cd /var/www/greenpoly

          # 拉取最新代码
          git pull origin main 2>/dev/null || git clone https://github.com/OrangeK1NG-714/vb-greenpoly.git .

          # 完整安装依赖(Next 构建需要 devDependencies;服务器在国内,用镜像源)
          npm install --registry=https://registry.npmmirror.com

          # 先生成 Prisma 客户端,再构建(顺序不能反)
          export DATABASE_URL="file:/var/www/greenpoly/prod.db"
          npx prisma generate
          npm run build

          # 数据库迁移
          npx prisma migrate deploy || echo "No migrations to apply"

          # 用 PM2 启动或重启服务(固定 3002 端口,避开宝塔占用的 3000)
          pm2 describe greenpoly > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            PORT=3002 pm2 restart greenpoly --update-env
          else
            PORT=3002 pm2 start npm --name greenpoly -- start
          fi

          pm2 save
          echo "✅ GreenPoly deployed successfully"

    - name: Bark 通知
      if: always()
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: |
        if [ -z "$BARK_KEY" ]; then echo "BARK_KEY 未配置，跳过通知"; exit 0; fi
        if [ "${{ job.status }}" = "success" ]; then ICON="✅"; RESULT="成功"; else ICON="❌"; RESULT="失败"; fi
        curl -fsS -m 10 -X POST "https://api.day.app/push" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "{\"device_key\":\"$BARK_KEY\",\"title\":\"$ICON ${{ github.repository }} $RESULT\",\"body\":\"工作流：${{ github.workflow }} · 分支：${{ github.ref_name }} · 提交：${GITHUB_SHA:0:7}\",\"group\":\"GitHub CI\",\"icon\":\"https://stats.richardq.tech/icons/greenpoly.png\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          || echo "Bark 通知发送失败（不影响构建）"

name: Deploy GreenPoly

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build production release
      run: |
        set -Eeuo pipefail
        npm install --global npm@11.12.1 --no-audit --no-fund
        npm --version
        npm ci --no-audit --no-fund
        npx prisma generate
        npm run build
        release_root="$RUNNER_TEMP/greenpoly-release"
        mkdir -p "$release_root/.next"
        cp -a .next/standalone/. "$release_root/"
        cp -a .next/static "$release_root/.next/static"
        cp -a public "$release_root/public"
        cp -a prisma "$release_root/prisma"
        cp -a prisma.config.ts "$release_root/prisma.config.ts"
        find "$release_root" -maxdepth 2 -type f -name '.env*' -delete
        if find "$release_root" -maxdepth 2 -type f -name '.env*' -print -quit | grep -q .; then
          echo "standalone release contains an environment file" >&2
          exit 1
        fi
        tar -C "$release_root" -czf "$RUNNER_TEMP/greenpoly-release.tgz" .
      env:
        NEXT_PUBLIC_SITE_URL: https://green.richardq.tech
        DATABASE_URL: file:./build.db

    - name: Upload standalone release
      env:
        RELEASE_DIR: /var/www/greenpoly-releases/${{ github.sha }}
      run: |
        set -Eeuo pipefail
        key_file="$RUNNER_TEMP/greenpoly-deploy-key"
        archive="$RUNNER_TEMP/greenpoly-release.tgz"
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$key_file"
        chmod 600 "$key_file"
        trap 'rm -f "$key_file"' EXIT
        archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
        ssh_options=(
          -i "$key_file"
          -o BatchMode=yes
          -o StrictHostKeyChecking=accept-new
          -o ConnectTimeout=60
          -o ServerAliveInterval=30
          -o ServerAliveCountMax=6
        )
        retry() {
          local attempt=1
          while ! "$@"; do
            if [ "$attempt" -ge 3 ]; then return 1; fi
            sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done
        }
        retry timeout 120s ssh "${ssh_options[@]}" \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "mkdir -p '$RELEASE_DIR'"
        retry timeout 300s ssh "${ssh_options[@]}" \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "cat > '$RELEASE_DIR/release.tgz'" < "$archive"
        retry timeout 120s ssh "${ssh_options[@]}" \
          "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "cd '$RELEASE_DIR' && printf '%s  release.tgz\n' '$archive_sha' | sha256sum -c - && tar -xzf release.tgz && rm -f release.tgz"

    - name: Canary and switch production
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        command_timeout: 10m
        script: |
          set -Eeuo pipefail
          RELEASE_DIR="/var/www/greenpoly-releases/${{ github.sha }}"
          SHARED_DIR="/var/www/greenpoly"
          TOOLING_DIR="/var/www/greenpoly-tooling"
          PREVIOUS_DIR="$(readlink -f /var/www/greenpoly-current 2>/dev/null || true)"
          if [ -z "$PREVIOUS_DIR" ]; then PREVIOUS_DIR="$SHARED_DIR"; fi
          test -f "$SHARED_DIR/.env"
          cd "$RELEASE_DIR"
          ln -sfn "$SHARED_DIR/.env" .env
          export DATABASE_URL="file:$SHARED_DIR/prod.db"

          # Keep Prisma CLI as shared deployment tooling; application releases
          # remain standalone and never install or build dependencies on the
          # memory-constrained production host.
          if [ ! -x "$TOOLING_DIR/node_modules/.bin/prisma" ]; then
            test -x "$PREVIOUS_DIR/node_modules/.bin/prisma"
            mkdir -p "$TOOLING_DIR"
            cp -al "$PREVIOUS_DIR/node_modules" "$TOOLING_DIR/node_modules"
          fi
          "$TOOLING_DIR/node_modules/.bin/prisma" migrate deploy \
            --schema "$RELEASE_DIR/prisma/schema.prisma"

          start_release() {
            name="$1"
            directory="$2"
            port="$3"
            if [ -f "$directory/server.js" ]; then
              HOSTNAME=127.0.0.1 PORT="$port" pm2 start "$directory/server.js" \
                --name "$name" --cwd "$directory"
            else
              PORT="$port" pm2 start npm --name "$name" --cwd "$directory" -- start
            fi
          }

          # 先在 3003 启动 canary。除了首页，还验证后台保护和浏览器同源登录。
          pm2 delete greenpoly-canary > /dev/null 2>&1 || true
          start_release greenpoly-canary "$RELEASE_DIR" 3003

          CANARY_OK=0
          for attempt in $(seq 1 30); do
            HOME_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/admin/login || true)"
            SALES_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/admin/sales || true)"
            LOGIN_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:3003/api/admin/login \
              -H 'content-type: application/json' \
              --data '{"email":"invalid@example.test","password":"invalid-password"}' || true)"
            if [ "$HOME_STATUS" = "200" ] && [ "$SALES_STATUS" = "307" ] && [ "$LOGIN_STATUS" = "401" ]; then
              CANARY_OK=1
              break
            fi
            sleep 1
          done

          if [ "$CANARY_OK" = "1" ]; then
            RELEASE_ENV="$SHARED_DIR/.env" node <<'NODE' || CANARY_OK=0
          const fs = require("node:fs");
          const entries = fs.readFileSync(process.env.RELEASE_ENV, "utf8")
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => {
              const index = line.indexOf("=");
              return index > 0 ? [line.slice(0, index), line.slice(index + 1)] : ["", ""];
            })
            .filter(([key]) => key);
          const token = Object.fromEntries(entries).GREENPOLY_INTERNAL_STATS_TOKEN;
          if (!token || Buffer.byteLength(token) < 32) throw new Error("missing internal stats token");
          fetch("http://127.0.0.1:3003/api/internal/marketing-stats?days=1", {
            headers: { authorization: `Bearer ${token}` },
          }).then((response) => {
            if (!response.ok) throw new Error(`internal stats status ${response.status}`);
          });
          NODE
          fi
          pm2 delete greenpoly-canary > /dev/null 2>&1 || true
          if [ "$CANARY_OK" != "1" ]; then
            echo "Canary health check failed"
            exit 1
          fi

          # Canary 通过后再切换正式端口；失败则恢复上一个 release。
          pm2 delete greenpoly > /dev/null 2>&1 || true
          start_release greenpoly "$RELEASE_DIR" 3002

          PRODUCTION_OK=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/ > /dev/null; then
              PRODUCTION_OK=1
              break
            fi
            sleep 1
          done

          if [ "$PRODUCTION_OK" != "1" ]; then
            echo "Production health check failed; rolling back to $PREVIOUS_DIR"
            pm2 delete greenpoly > /dev/null 2>&1 || true
            start_release greenpoly "$PREVIOUS_DIR" 3002
            pm2 save
            exit 1
          fi

          ln -sfn "$RELEASE_DIR" /var/www/greenpoly-current
          pm2 save
          echo "✅ GreenPoly deployed successfully: $RELEASE_DIR"

    - name: Bark 通知
      if: always()
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: |
        if [ -z "$BARK_KEY" ]; then echo "BARK_KEY 未配置，跳过通知"; exit 0; fi
        if [ "${{ job.status }}" = "success" ]; then
          RESULT="成功"; LEVEL="active"; SOUND="minuet"; GROUP="CI/CD · 成功"
        else
          RESULT="失败"; LEVEL="timeSensitive"; SOUND="alarm"; GROUP="CI/CD · 失败"
        fi
        jq -n \
          --arg key "$BARK_KEY" \
          --arg title "部署$RESULT · GreenPoly" \
          --arg body "分支：${{ github.ref_name }} · 提交：${GITHUB_SHA:0:7} · 点击查看运行详情" \
          --arg group "$GROUP" \
          --arg level "$LEVEL" \
          --arg sound "$SOUND" \
          --arg id "cicd-${{ github.repository_id }}-deploy" \
          --arg icon "https://stats.richardq.tech/icon-greenpoly.png" \
          --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          '{device_key:$key,title:$title,subtitle:"GitHub Actions",body:$body,group:$group,level:$level,sound:$sound,id:$id,icon:$icon,url:$url,isArchive:"1"}' \
          | curl -fsS -m 10 -X POST "https://api.day.app/push" \
              -H "Content-Type: application/json; charset=utf-8" -d @- \
          || echo "Bark 通知发送失败（不影响构建）"

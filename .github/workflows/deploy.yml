name: Deploy GreenPoly

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build Next.js app
      run: |
        npm install
        npx prisma generate
        npm run build
      env:
        NEXT_PUBLIC_SITE_URL: https://green.richardq.tech
        DATABASE_URL: file:./build.db

    - name: Push code to server
      # 服务器连不上 GitHub（GFW），所以不再在服务器上 git pull ——
      # 由 CI  runner 把代码打包直接推过去。tar 流不含 .git/env/db，
      # 服务器上的 .env、prod.db 不受影响。
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        tar czf - \
          --exclude=.git --exclude=node_modules --exclude=.next \
          --exclude=dev.db --exclude=prod.db --exclude=.env --exclude=".env.*" \
          . | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "cd /var/www/greenpoly && tar xzf -"

    - name: Build and restart on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # set -e: 任何一步失败都要让部署失败——不要再静默假成功
          set -e
          cd /var/www/greenpoly

          # 完整安装依赖(Next 构建需要 devDependencies)
          # 主用国内镜像源;镜像还没同步的新版本(如 prisma 7.9.0)回退官方源
          npm install --registry=https://registry.npmmirror.com --no-audit --no-fund || \
            npm install --registry=https://registry.npmjs.org --no-audit --no-fund

          # 先生成 Prisma 客户端,再构建(顺序不能反)
          export DATABASE_URL="file:/var/www/greenpoly/prod.db"
          npx prisma generate
          npm run build

          # 数据库迁移
          npx prisma migrate deploy

          # 用 PM2 启动或重启服务(固定 3002 端口,避开宝塔占用的 3000)
          if pm2 describe greenpoly > /dev/null 2>&1; then
            PORT=3002 pm2 restart greenpoly --update-env
          else
            PORT=3002 pm2 start npm --name greenpoly -- start
          fi

          pm2 save
          echo "✅ GreenPoly deployed successfully"

    - name: Bark 通知
      if: always()
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: |
        if [ -z "$BARK_KEY" ]; then echo "BARK_KEY 未配置，跳过通知"; exit 0; fi
        if [ "${{ job.status }}" = "success" ]; then ICON="✅"; RESULT="成功"; else ICON="❌"; RESULT="失败"; fi
        curl -fsS -m 10 -X POST "https://api.day.app/push" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "{\"device_key\":\"$BARK_KEY\",\"title\":\"$ICON ${{ github.repository }} $RESULT\",\"body\":\"工作流：${{ github.workflow }} · 分支：${{ github.ref_name }} · 提交：${GITHUB_SHA:0:7}\",\"group\":\"GitHub CI\",\"icon\":\"https://stats.richardq.tech/icons/greenpoly.png\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          || echo "Bark 通知发送失败（不影响构建）"
